[project]
name = "x402-xrpl-service"
version = "0.1.0"
description = "Aigentia internal service: XRPL x402 (exact / presigned Payment) facilitator + unsigned payer builder. No game logic, no wallet seeds."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "x402-xrpl==0.3.4",
  "xrpl-py>=5.2",
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2,<3",
  "httpx>=0.28.1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PL"]
ignore = [
  "PLR0911", # many returns: the verifier is one long fail-closed checklist
  "PLR0912", # many branches: same
  "PLR0913", # many arguments: explicit keyword-only builders
  "PLR0915", # many statements: same
  "PLR2004", # magic values: protocol constants are spelled out where used
  "RUF012",  # mutable class attrs are not used
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "stubs"
packages = ["app"]
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# x402-xrpl 0.3.4 ships no py.typed marker; local stubs under stubs/ cover the
# handful of symbols this service uses (see stubs/x402_xrpl/*.pyi).
module = ["x402_xrpl", "x402_xrpl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
